name: petland7
services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: petland_demo
      POSTGRES_USER: petland_migrator
      POSTGRES_PASSWORD: ${STAGING_POSTGRES_PASSWORD:?Run staging-init}
      APP_DATABASE_PASSWORD: ${STAGING_APP_PASSWORD:?Run staging-init}
    entrypoint: [sh, /opt/staging-postgres.sh]
    command: [postgres, -c, ssl=on, -c, ssl_cert_file=/tmp/petland-tls/server.crt, -c, ssl_key_file=/tmp/petland-tls/server.key]
    ports: ["127.0.0.1:55434:5432"]
    volumes:
      - staging_data:/var/lib/postgresql/data
      - ../../.local/staging/certs:/run/certs:ro
      - ../docker/staging-postgres.sh:/opt/staging-postgres.sh:ro
      - ../docker/staging-init-db.sh:/docker-entrypoint-initdb.d/10-runtime-role.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U petland_migrator -d petland_demo"]
      interval: 3s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.31.2@sha256:74d609a42ec279aa63c6b4622a6fa9b5408d1ad5b1d76a1c4be40a265ce0863d
    environment:
      MP_MAX_MESSAGES: "200"
      MP_SMTP_TLS_CERT: /run/certs/mailpit.crt
      MP_SMTP_TLS_KEY: /run/certs/mailpit.key
      MP_SMTP_REQUIRE_STARTTLS: "true"
    volumes: ["../../.local/staging/certs:/run/certs:ro"]
    ports: ["127.0.0.1:8026:8025"]
  migrate:
    image: petland-stage-api:${RELEASE_ID:-local}
    build: { context: ../.., dockerfile: infra/docker/api.Dockerfile, args: { REVISION: "${RELEASE_ID:-local}" } }
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://petland_migrator:${STAGING_POSTGRES_PASSWORD}@postgres:5432/${ACTIVE_DATABASE:-petland_demo}?sslmode=verify-full&sslrootcert=/run/certs/ca.crt
    volumes: ["../../.local/staging/certs/ca.crt:/run/certs/ca.crt:ro"]
    command: [/app/.venv/bin/alembic, upgrade, head]
    depends_on: { postgres: { condition: service_healthy } }
  api:
    image: petland-stage-api:${RELEASE_ID:-local}
    build: { context: ../.., dockerfile: infra/docker/api.Dockerfile, args: { REVISION: "${RELEASE_ID:-local}" } }
    environment:
      APP_ENV: staging
      DATABASE_URL: postgresql+psycopg://petland_app:${STAGING_APP_PASSWORD}@postgres:5432/${ACTIVE_DATABASE:-petland_demo}?sslmode=verify-full&sslrootcert=/run/certs/ca.crt
      PUBLIC_ORIGIN: https://localhost:8443
      SMTP_HOST: mailpit
      SMTP_STARTTLS: "true"
      SSL_CERT_FILE: /run/certs/ca.crt
      WEB_CONCURRENCY: "2"
    volumes: ["../../.local/staging/certs/ca.crt:/run/certs/ca.crt:ro"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [/app/.venv/bin/uvicorn, petland.bootstrap.app:create_app, --factory, --host, "0.0.0.0", --port, "8000", --workers, "2", --no-access-log, --no-proxy-headers]
    depends_on:
      mailpit: { condition: service_started }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, /app/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    image: petland-stage-web:${RELEASE_ID:-local}
    build:
      context: ../..
      dockerfile: infra/docker/web-static.Dockerfile
      args: { REVISION: "${RELEASE_ID:-local}" }
    user: "${LOCAL_UID:-10001}:${LOCAL_GID:-10001}"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ../../.local/staging/certs/web.crt:/run/certs/web.crt:ro
      - ../../.local/staging/certs/web.key:/run/certs/web.key:ro
    ports: ["127.0.0.1:8443:8443"]
    depends_on: { api: { condition: service_healthy } }
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  staging_data:
